name: ai_butler_app
description: "AI 生活管家 - 智慧社區服務需求理解與媒合平台"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  # AI 管家的 SSE 串流用 http + fetch_client，不用 dio。
  # 原因：dio 在 Web 上走 XMLHttpRequest，不支援漸進式讀取 byte stream，
  # ResponseType.stream 在瀏覽器會拿不到資料並拋例外（原生平台正常，
  # 所以「後端測得過、App 卻壞」）。fetch_client 走 Fetch API 才有真串流。
  http: ^1.2.0
  fetch_client: ^1.1.4

  # State Management
  flutter_riverpod: ^2.6.1

  # Speech to Text
  # speech_to_text: ^7.0.0

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  tutorial_coach_mark: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
